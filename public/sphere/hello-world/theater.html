html, body { margin: 0; background: #02060d; }
/* Operator displays (ops.js). High-performance HMI conventions: neutral grays for
 * normal states, colour reserved for abnormal conditions and alarms, redundant
 * shape coding for alarm priority, and explicit data-quality marks. Informed by
 * ISA-101 / ISA-5.1 / IEC 62682 practice; not a claim of conformance. */
:root {
  --hmi-bg: #23282d; --hmi-panel: #2d3339; --hmi-panel-2: #353c43; --hmi-rule: #444c55;
  --hmi-line: #8b959f; --hmi-equip: #a9b2bb; --hmi-equip-dark: #5b646d;
  --hmi-text: #e3e7eb; --hmi-dim: #8d969f; --hmi-faint: #66707a;
  --hmi-fill: #dfe4e8; --hmi-water: #4f6878; --hmi-water-fill: #6f8ea2;
  --hmi-p1: #ff4d4d; --hmi-p2: #ff9f1c; --hmi-p3: #f4d35e; --hmi-info: #9fc4dd;
  --hmi-quality: #7fd4ff; --hmi-expired: #ffb547; --hmi-accent: #3fd0c9; --hmi-cmd: #b9a6ff;
}
.hmi-figure { margin: 0; }
.hmi { display: block; width: 100%; height: auto; border-radius: 8px; background: var(--hmi-bg);
  font-family: "SF Pro Text", "Segoe UI", system-ui, sans-serif; }
.hmi text { fill: var(--hmi-text); }
.hmi-bg { fill: var(--hmi-bg); }
.hmi-header { fill: #1b1f23; }
.hmi-title { font-size: 13px; font-weight: 700; letter-spacing: .06em; }
.hmi-clock { font: 600 14px ui-monospace, "SF Mono", Menlo, monospace; fill: var(--hmi-accent) !important; }
.hmi-mode-badge { fill: #2a3a3c; stroke: #3f6b68; }
.hmi-mode-text { font-size: 10px; font-weight: 700; letter-spacing: .08em; fill: #9fe3dc !important; }
.hmi-section { font-size: 11px; font-weight: 700; letter-spacing: .1em; fill: var(--hmi-dim) !important; }
.hmi-label { font-size: 10px; font-weight: 700; letter-spacing: .08em; fill: var(--hmi-dim) !important; }
.hmi-equip-label { font-size: 11px; font-weight: 700; letter-spacing: .05em; fill: var(--hmi-equip) !important; }
.hmi-edge-label { font-size: 10px; font-weight: 700; letter-spacing: .06em; fill: var(--hmi-dim) !important; }
.hmi-edge-note { font-size: 9px; font-style: italic; fill: var(--hmi-faint) !important; }
.hmi-value { font: 600 13px ui-monospace, "SF Mono", Menlo, monospace; }
.hmi-big { font: 700 26px ui-monospace, "SF Mono", Menlo, monospace; }
.hmi-stamp { font: 9.5px ui-monospace, "SF Mono", Menlo, monospace; fill: var(--hmi-dim) !important; }
.hmi-note { font-size: 11px; fill: var(--hmi-equip) !important; }
.hmi-scale { font-size: 9px; fill: var(--hmi-faint) !important; }
.hmi-quality { fill: var(--hmi-quality) !important; }
.hmi-abnormal { fill: var(--hmi-p2) !important; }
.hmi-expired-text { fill: var(--hmi-expired) !important; }
.hmi-disclaimer { font-size: 10px; fill: var(--hmi-faint) !important; }
.hmi-legend-text { font-size: 10px; fill: var(--hmi-dim) !important; }

/* process graphics */
.hmi-pipe { fill: none; stroke: var(--hmi-line); stroke-width: 3; stroke-linejoin: round; }
.hmi-water-line, .hmi-penstock { stroke: var(--hmi-water); stroke-width: 5; }
.hmi-bus { stroke-width: 3; }
.hmi-energized { stroke: var(--hmi-fill); }
.hmi-flowing, .hmi-cmd-flow { stroke-dasharray: 10 8; animation: hmi-flow 1.1s linear infinite; }
.hmi-flowing { stroke: var(--hmi-water-fill); }
.hmi-cmd-flow { stroke: var(--hmi-cmd); stroke-opacity: .55; }
@keyframes hmi-flow { to { stroke-dashoffset: -18; } }
.hmi-arrowhead { fill: var(--hmi-line); }
.hmi-water { fill: var(--hmi-water); opacity: .8; }
.hmi-generator { fill: var(--hmi-panel); stroke: var(--hmi-equip); stroke-width: 3; }
.hmi-generator.hmi-running { fill: var(--hmi-fill); }
.hmi-generator-mark { font: 800 22px system-ui, sans-serif; fill: var(--hmi-equip) !important; }
.hmi-running + .hmi-generator-mark, .hmi-generator.hmi-running ~ .hmi-generator-mark { fill: var(--hmi-bg) !important; }
.hmi-xfmr { fill: none; stroke: var(--hmi-equip); stroke-width: 2.5; }
.hmi-breaker { stroke: var(--hmi-equip); stroke-width: 3; fill: none; }
.hmi-breaker.hmi-closed { fill: var(--hmi-fill); }
.hmi-breaker.hmi-open { fill: var(--hmi-bg); }
.hmi-breaker.hmi-alarm-1 { stroke: var(--hmi-p1); animation: hmi-blink 1s steps(2) infinite; }
.hmi-open-bar { stroke: var(--hmi-equip); stroke-width: 3; }
.hmi-pump { fill: var(--hmi-bg); stroke: var(--hmi-equip); stroke-width: 3; }
.hmi-pump.hmi-running { fill: var(--hmi-fill); }
.hmi-pump-mark { fill: none; stroke: var(--hmi-equip-dark); stroke-width: 2.5; }
.hmi-cmd-tag { fill: none; stroke: var(--hmi-cmd); }
.hmi-cmd-tag-text { font-size: 9.5px; font-weight: 800; fill: var(--hmi-cmd) !important; }
.hmi-valve { stroke: var(--hmi-equip); stroke-width: 2.5; fill: var(--hmi-bg); }
.hmi-valve.hmi-valve-cmd-open { fill: none; stroke: var(--hmi-cmd); }
.hmi-valve.hmi-valve-cmd-closed { fill: var(--hmi-equip-dark); }
.hmi-tank { fill: var(--hmi-panel); stroke: var(--hmi-equip); stroke-width: 2.5; }
.hmi-tank-fill { fill: var(--hmi-water-fill); opacity: .85; }
.hmi-tank-surface { stroke: #b7d3e3; stroke-width: 2; }
.hmi-leg { stroke: var(--hmi-equip-dark); stroke-width: 4; }
.hmi-uf { fill: var(--hmi-panel); stroke: var(--hmi-equip); stroke-width: 2.5; }
.hmi-membrane { fill: var(--hmi-panel-2); stroke: var(--hmi-equip-dark); }
.hmi-membrane-bw { fill: #45525c; stroke: var(--hmi-cmd); stroke-dasharray: 4 3; }
.hmi-mcc { fill: var(--hmi-panel-2); stroke: var(--hmi-equip); }
.hmi-mcc-text { font-size: 10px; font-weight: 800; fill: var(--hmi-equip) !important; }
.hmi-notice { fill: var(--hmi-panel); stroke: var(--hmi-rule); }
.hmi-validity { fill: var(--hmi-equip); }
.hmi-expired-box { fill: none; stroke: var(--hmi-expired); stroke-width: 2; stroke-dasharray: 6 4; }

/* instruments and indicators */
.hmi-bubble circle { fill: var(--hmi-panel); stroke: var(--hmi-equip); stroke-width: 2; }
.hmi-bubble line { stroke: var(--hmi-equip); stroke-width: 1.5; }
.hmi-bubble.hmi-unknown circle { stroke-dasharray: 4 3; stroke: var(--hmi-quality); }
.hmi-bubble-letters { font-size: 10px; font-weight: 800; }
.hmi-bubble-loop { font-size: 9.5px; fill: var(--hmi-dim) !important; }
.hmi-analog-track { fill: var(--hmi-panel-2); stroke: var(--hmi-rule); }
.hmi-analog-fill { fill: var(--hmi-equip-dark); }
.hmi-pointer { fill: var(--hmi-fill); }
.hmi-tick { stroke: var(--hmi-faint); }
.hmi-trend { fill: #1e2328; stroke: var(--hmi-rule); }
.hmi-trend-line { fill: none; stroke: var(--hmi-fill); stroke-width: 2; }
.hmi-trend-now { stroke: var(--hmi-accent); stroke-width: 1; stroke-dasharray: 2 2; }
.hmi-hatch-bg { fill: #26313a; }
.hmi-hatch-line { stroke: var(--hmi-quality); stroke-opacity: .45; stroke-width: 2.5; }
.hmi-nodata-box { stroke: var(--hmi-quality); stroke-opacity: .6; stroke-dasharray: 3 3; }
.hmi-nodata-text { font: 700 10px ui-monospace, "SF Mono", Menlo, monospace; fill: var(--hmi-quality) !important; letter-spacing: .08em; }
.hmi-unknown { stroke-dasharray: 4 3; }

/* faceplates and annunciators */
.hmi-faceplate { fill: var(--hmi-panel); stroke: var(--hmi-rule); }
.hmi-faceplate-title { font-size: 11px; font-weight: 800; letter-spacing: .07em; }
.hmi-faceplate-rule { stroke: var(--hmi-rule); }
.hmi-row-label { font-size: 11.5px; fill: var(--hmi-equip) !important; }
.hmi-row-value { font: 700 12px ui-monospace, "SF Mono", Menlo, monospace; }
.hmi-kind { fill: none; stroke-width: 1.2; }
.hmi-kind-text { font-size: 8.5px; font-weight: 800; letter-spacing: .06em; }
.hmi-kind-req { stroke: #7aa2c7; } .hmi-kind-req + .hmi-kind-text { fill: #9cc0e2 !important; }
.hmi-kind-dec { stroke: #c6a96b; } .hmi-kind-dec + .hmi-kind-text { fill: #e2c88e !important; }
.hmi-kind-cmd { stroke: var(--hmi-cmd); } .hmi-kind-cmd + .hmi-kind-text { fill: var(--hmi-cmd) !important; }
.hmi-kind-fbk { stroke: #9fd8a4; } .hmi-kind-fbk + .hmi-kind-text { fill: #b9ebbd !important; }
.hmi-kind-proc { stroke: var(--hmi-equip); } .hmi-kind-proc + .hmi-kind-text { fill: var(--hmi-equip) !important; }
.hmi-kind-net { stroke: #9fb0ff; } .hmi-kind-net + .hmi-kind-text { fill: #c0cbff !important; }
.hmi-annun rect { fill: #262b30; stroke: var(--hmi-rule); }
.hmi-annun-text { font-size: 10px; font-weight: 800; letter-spacing: .06em; fill: var(--hmi-faint) !important; }
.hmi-annun-on.hmi-alarm-1 rect { fill: #5a1f22; stroke: var(--hmi-p1); }
.hmi-annun-on.hmi-alarm-2 rect { fill: #5a3a12; stroke: var(--hmi-p2); }
.hmi-annun-on.hmi-alarm-3 rect { fill: #4d4417; stroke: var(--hmi-p3); }
.hmi-annun-on.hmi-alarm-info rect { fill: #24384a; stroke: var(--hmi-info); }
.hmi-annun-on .hmi-annun-text { fill: var(--hmi-text) !important; }

/* phases */
.hmi-phase rect { fill: #262b30; stroke: var(--hmi-rule); }
.hmi-phase-text { font-size: 10px; font-weight: 800; letter-spacing: .07em; fill: var(--hmi-faint) !important; }
.hmi-phase-active rect { fill: none; stroke: var(--hmi-cmd); stroke-width: 2; }
.hmi-phase-active .hmi-phase-text { fill: var(--hmi-cmd) !important; }
.hmi-phase-recorded rect { fill: none; stroke: var(--hmi-equip); stroke-dasharray: 4 3; }
.hmi-phase-recorded .hmi-phase-text { fill: var(--hmi-text) !important; }
.hmi-phase.hmi-unknown rect { stroke: var(--hmi-quality); stroke-dasharray: 3 3; }

/* alarms */
.hmi-alarm-banner { fill: #1e2226; }
.hmi-alarm-none { font-size: 11px; font-weight: 700; letter-spacing: .08em; fill: var(--hmi-faint) !important; }
.hmi-alarm-text { font-size: 12px; font-weight: 800; letter-spacing: .04em; }
.hmi-alarm-text.hmi-alarm-1 { fill: var(--hmi-p1) !important; }
.hmi-alarm-text.hmi-alarm-2 { fill: var(--hmi-p2) !important; }
.hmi-alarm-text.hmi-alarm-3 { fill: var(--hmi-p3) !important; }
.hmi-alarm-stamp { font: 9.5px ui-monospace, "SF Mono", Menlo, monospace; fill: var(--hmi-dim) !important; }
.hmi-alarm-prior { opacity: .55; }
.hmi-prio path { stroke: #111; stroke-width: 1; }
.hmi-prio-1 path { fill: var(--hmi-p1); } .hmi-prio-2 path { fill: var(--hmi-p2); } .hmi-prio-3 path { fill: var(--hmi-p3); }
.hmi-prio-num { font: 800 9px system-ui, sans-serif; fill: #111 !important; }
.hmi-alarm-item:not(.hmi-alarm-prior) .hmi-prio-1 { animation: hmi-blink 1s steps(2) infinite; }
@keyframes hmi-blink { 50% { opacity: .35; } }

/* evidence chain */
.hmi-chain rect { fill: #262b30; stroke: var(--hmi-rule); }
.hmi-chain-label { font-size: 9.5px; font-weight: 800; letter-spacing: .06em; fill: var(--hmi-dim) !important; }
.hmi-chain-event { font: 700 20px ui-monospace, "SF Mono", Menlo, monospace; fill: var(--hmi-faint) !important; }
.hmi-chain-time { font: 11px ui-monospace, "SF Mono", Menlo, monospace; fill: var(--hmi-faint) !important; }
.hmi-chain-note { font-size: 9px; fill: var(--hmi-faint) !important; }
.hmi-chain-current { cursor: pointer; }
.hmi-chain-current rect { stroke: var(--hmi-accent); stroke-width: 1.6; fill: #1f3434; }
.hmi-chain-current .hmi-chain-event { fill: var(--hmi-text) !important; }
.hmi-chain-current .hmi-chain-label, .hmi-chain-current .hmi-chain-time { fill: #a8e9e3 !important; }
.hmi-chain-prior { cursor: pointer; }
.hmi-chain-prior rect { stroke-dasharray: 5 4; }
.hmi-chain-prior .hmi-chain-event { fill: var(--hmi-dim) !important; }
.hmi-chain:focus { outline: none; }
.hmi-chain:focus rect { stroke: #fff; stroke-width: 2; }
.hmi-chain-arrow { stroke: var(--hmi-faint); stroke-width: 2; }
.hmi-live { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* replay transport */
.ops-screen { position: relative; }
.ops-replay { display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto; align-items: center; gap: 12px;
  background: #1b1f23; color: #e3e7eb; border-radius: 0 0 8px 8px; padding: 10px 14px; margin-top: -6px; }
.ops-play { background: var(--hmi-accent); color: #062523; border: 0; border-radius: 999px; font-weight: 800;
  padding: 7px 16px; min-width: 76px; }
.ops-play:hover { filter: brightness(1.1); }
.ops-track { position: relative; height: 28px; display: flex; align-items: center; }
.ops-range { width: 100%; accent-color: var(--hmi-accent); position: relative; z-index: 1; background: transparent; border: 0; padding: 0; }
.ops-ticks { position: absolute; inset: 0 8px; pointer-events: none; }
.ops-tick { position: absolute; top: 1px; width: 2px; height: 8px; margin-left: -1px; background: #6a747e; border-radius: 1px; }
.ops-tick-network { background: #7aa2c7; } .ops-tick-controller { background: #e2c88e; }
.ops-tick-device { background: #b9ebbd; } .ops-tick-process { background: #c4ccd3; }
.ops-tick-service { background: var(--hmi-accent); } .ops-tick-dependency { background: var(--hmi-expired); }
.ops-tick-operator { background: #c0cbff; }
.ops-clock { font: 600 13px ui-monospace, "SF Mono", Menlo, monospace; color: var(--hmi-accent); min-width: 66px; }
.ops-speed { display: inline-flex; border: 1px solid #3e464e; border-radius: 6px; overflow: hidden; }
.ops-speed button { background: transparent; color: #aab4bd; border: 0; padding: 5px 9px; font-size: 12px; font-weight: 700; }
.ops-speed button[aria-pressed="true"] { background: #2f3d3f; color: #9fe3dc; }
@media (max-width: 760px) {
  .ops-replay { grid-template-columns: auto minmax(0, 1fr); }
  .ops-clock, .ops-speed { justify-self: start; }
}
@media (prefers-reduced-motion: reduce) {
  .hmi-flowing, .hmi-cmd-flow, .hmi-breaker.hmi-alarm-1, .hmi-alarm-item .hmi-prio-1 { animation: none; }
}
.hmi-row-text { font: 600 10.5px ui-monospace, "SF Mono", Menlo, monospace; fill: var(--hmi-text) !important; }

/* 25-H1 synchroscope */
.hmi .hmi-sync-face { fill: #10161d; stroke: #5b6b7b; stroke-width: 1.5; }
.hmi .hmi-sync-pointer { stroke: #e8eef5; stroke-width: 2.5; stroke-linecap: round; }

/* Floor views (floor.js): a synthetic "floor camera" rendering of modeled
 * physical state, styled to read differently from the operator displays. */
.fl-figure { position: relative; margin: 0; border-radius: 8px; overflow: hidden; background: #15130f; }
.fl { display: block; width: 100%; height: auto; font-family: "SF Pro Text", "Segoe UI", system-ui, sans-serif; }
.fl text { fill: #efe8da; }
.fl-scanlines { position: absolute; inset: 0; pointer-events: none;
  background: repeating-linear-gradient(0deg, rgba(0, 0, 0, .14) 0 1px, transparent 1px 3px),
    radial-gradient(ellipse at center, transparent 55%, rgba(0, 0, 0, .45) 100%); mix-blend-mode: multiply; }
.fl-bg { fill: #1a1814; }
.fl-wall { fill: #3a3832; } .fl-side { fill: #2c2a25; } .fl-floor { fill: #57534a; }
.fl-tile { stroke: #6a655a; stroke-width: 1; opacity: .55; }
.fl-crane { fill: #c9a227; opacity: .75; }
.fl-wall-label { font-size: 13px; font-weight: 800; letter-spacing: .14em; fill: #c9c0ad !important; }
.fl-shadow { fill: #000; opacity: .32; }
.fl-steel { fill: #6f7c86; stroke: #2b3136; stroke-width: 1.5; }
.fl-steel-top { fill: #8d9ba5; stroke: #2b3136; stroke-width: 1.2; }
.fl-steel-ring { fill: #5d6a73; stroke: #2b3136; }
.fl-rotor { transform-box: fill-box; transform-origin: center; }
.fl-rotor-disc { fill: #3d464d; stroke: #9aa7b0; }
.fl-rotor-spokes { stroke: #d7dee3; stroke-width: 3; }
.fl-spinning .fl-rotor-spokes { animation: fl-spin-y .5s linear infinite; transform-box: fill-box; transform-origin: center; }
@keyframes fl-spin-y { to { transform: scaleX(-1); } }
.fl-spinning-x .fl-guard-stripes { animation: fl-stripe .35s linear infinite; }
@keyframes fl-stripe { to { transform: translateX(14px); } }
.fl-guard { fill: #d9a520; stroke: #3b2f0a; } .fl-guard-stripes { stroke: #3b2f0a; stroke-width: 4; }
.fl-coupling { clip-path: inset(0); }
.fl-fins { fill: #58646d; } .fl-terminal { fill: #4f5a62; stroke: #2b3136; }
.fl-pipe { fill: #4c6f86; stroke: #263744; }
.fl-skid { fill: #3a3f43; }
.fl-cabinet { fill: #8a929a; stroke: #2b3136; stroke-width: 1.5; } .fl-cabinet-side { fill: #5e666d; }
.fl-cabinet-panel { fill: #2b3136; } .fl-cabinet-door { fill: #9aa3ab; stroke: #5e666d; }
.fl-cabinet-label { font: 800 11px ui-monospace, Menlo, monospace; fill: #e9eef2 !important; }
.fl-handle { fill: #2b3136; }
.fl-flag { stroke: #111; stroke-width: 1.5; }
.fl-flag-closed { fill: #c62828; } .fl-flag-open { fill: #2e7d32; } .fl-flag-tripped { fill: #c62828; animation: fl-blink .8s steps(2) infinite; }
.fl-flag-unknown { fill: #2b3136; stroke: #7fd4ff; stroke-dasharray: 3 3; }
.fl-flag-text { font: 900 12px ui-monospace, Menlo, monospace; fill: #fff !important; letter-spacing: .06em; }
@keyframes fl-blink { 50% { opacity: .3; } }
.fl-module { fill: #b9c4cc; stroke: #5d6a73; } .fl-module-top { fill: #d5dde2; stroke: #5d6a73; }
.fl-not-modeled { fill: rgba(127, 212, 255, .06); stroke: #7fd4ff; stroke-width: 1.5; stroke-dasharray: 7 5; }
.fl-label { font-size: 11px; font-weight: 800; letter-spacing: .07em; fill: #e9e2d2 !important; paint-order: stroke; stroke: #1a1814; stroke-width: 3; }
.fl-value { font: 600 11.5px ui-monospace, Menlo, monospace; fill: #fff6e0 !important; paint-order: stroke; stroke: #1a1814; stroke-width: 3; }
.fl-sub { font-size: 10px; font-style: italic; fill: #c9c0ad !important; }
.fl-quality { fill: #7fd4ff !important; }
.fl-pole { fill: #3b3f42; }
.fl-lamp { stroke: #111; stroke-width: 1; opacity: .25; }
.fl-lamp-red { fill: #ff3b3b; } .fl-lamp-amber { fill: #ffb020; } .fl-lamp-white { fill: #f0f0f0; }
.fl-stack-red .fl-lamp-red { opacity: 1; animation: fl-blink 1s steps(2) infinite; }
.fl-stack-amber .fl-lamp-amber { opacity: 1; } .fl-stack-white .fl-lamp-white { opacity: 1; }
.fl-dial-face { fill: #eae4d6; stroke: #2b3136; stroke-width: 3; }
.fl-dial-low { fill: none; stroke: #d48a1c; stroke-width: 6; } .fl-dial-ok { fill: none; stroke: #4c8a4f; stroke-width: 6; }
.fl-needle { stroke: #1c1c1c; stroke-width: 3; stroke-linecap: round; } .fl-hub { fill: #1c1c1c; }
.fl-dial-q { font: 900 22px system-ui, sans-serif; fill: #1f5f7a !important; }
.fl-unknown .fl-dial-face { stroke: #7fd4ff; stroke-dasharray: 5 4; }
.fl-glass-tube { fill: rgba(220, 235, 245, .2); stroke: #c9d4dc; stroke-width: 2; }
.fl-glass-fill { fill: #3f8fbf; } .fl-glass-unknown { fill: rgba(127, 212, 255, .12); stroke: #7fd4ff; stroke-dasharray: 3 3; }
.fl-placard rect { fill: #24221d; stroke: #8b8270; }
.fl-placard-title { font-size: 9.5px; font-weight: 800; letter-spacing: .1em; fill: #c9c0ad !important; }
.fl-placard-value { font: 800 13px ui-monospace, Menlo, monospace; }
.fl-placard-sub { font-size: 9.5px; font-style: italic; fill: #a99f8a !important; }
.fl-placard.fl-ok rect { stroke: #6fbf73; } .fl-placard.fl-ok .fl-placard-value { fill: #a5e3a8 !important; }
.fl-placard.fl-warn rect { stroke: #ffb020; } .fl-placard.fl-warn .fl-placard-value { fill: #ffc861 !important; }
.fl-placard.fl-quality rect { stroke: #7fd4ff; stroke-dasharray: 5 4; } .fl-placard.fl-quality .fl-placard-value { fill: #7fd4ff !important; }
.fl-brackets { fill: none; stroke: #fff; stroke-width: 2; opacity: .75; }
.fl-osd { font: 700 12px ui-monospace, Menlo, monospace; fill: #f4f4f4 !important; letter-spacing: .05em; paint-order: stroke; stroke: #000; stroke-width: 3; }
.fl-osd-model { fill: #ffd27a !important; } .fl-osd-dim { fill: #b9b3a5 !important; font-weight: 600; }

/* HMI | floor split */
.split { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.split-stack { grid-template-columns: 1fr; }
.split-tools { display: flex; justify-content: flex-end; margin: 0 0 8px; }
.split-toggle { background: transparent; border: 1px solid #9facb1; border-radius: 4px; padding: 5px 10px; font-weight: 700; color: inherit; }
.split-toggle[aria-pressed="true"] { background: #dce9e6; color: #174f4b; }
.split-pane { min-width: 0; }
.split-title { display: flex; align-items: baseline; gap: 10px; margin: 0 0 6px; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; }
.split-title small { font-size: 11px; letter-spacing: 0; text-transform: none; color: #8d969f; font-weight: 500; }
.split-floor .split-title span { color: #c9a227; }
@media (max-width: 1100px) { .split { grid-template-columns: 1fr; } }
@media (prefers-reduced-motion: reduce) {
  .fl-spinning .fl-rotor-spokes, .fl-spinning-x .fl-guard-stripes, .fl-flag-tripped, .fl-stack-red .fl-lamp-red { animation: none; }
}

/* Recorded conditions (device models) and findings, the same rows the 3D floor shows. */
.fl-conditions { list-style: none; margin: 6px 0 0; padding: 0; display: grid; gap: 3px; font: 600 12px/1.35 ui-monospace, SFMono-Regular, Menlo, monospace; }
.fl-conditions[hidden] { display: none; }
.fl-cond { padding: 3px 8px; border-left: 3px solid #4b5b6b; color: #c8d3de; background: rgba(255, 255, 255, .03); }
.fl-cond-ok { border-color: #3c9a5f; }
.fl-cond-unknown { border-color: #6b7785; color: #8d99a6; }
.fl-cond-alert { border-color: #f59e12; color: #ffd08a; }
.fl-cond-finding { border-color: #f59e12; color: #ffd08a; }

/* Optional 3D floor (SphereFloor WebGL) under the operator display and floor view. */
.floor3d-pane { margin-top: 12px; }
.floor3d-tools { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 6px; }
.floor3d-box { position: relative; }
.floor3d-box.floor3d-on { aspect-ratio: 16 / 9; background: #0b0c0e; border-radius: 8px; overflow: hidden; }
.floor3d-frame { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
.floor3d-status { position: absolute; left: 0; right: 0; bottom: 8px; margin: 0; text-align: center; font-size: 12px; color: #9fb3c8; pointer-events: none; }
.floor3d-off { position: static; padding: 12px; color: #8a5a1a; }

/* 3D workspace: scene tree | 3D | inspector, with a transport (Open Industry Project's layout). */
.floor3d-workspace { position: fixed; inset: 0; z-index: 1000; margin: 0; display: grid; background: #0b0f14; color: #e8eef5;
  grid-template-columns: 270px minmax(0, 1fr) 360px; grid-template-rows: auto minmax(0, 1fr) auto;
  grid-template-areas: "head head head" "tree view insp" "bar bar bar"; }
.floor3d-workspace > .split-title, .floor3d-workspace > .floor3d-tools { display: none; }
.floor3d-workspace > .floor3d-box { grid-area: view; aspect-ratio: auto; border-radius: 0; }
.fw-header { grid-area: head; display: flex; gap: 12px; align-items: center; padding: 8px 14px; background: #121821; border-bottom: 1px solid #263241; font-size: 13px; }
.fw-header.fw-whatif { background: #f59e12; color: #111; }
.fw-banner { font-weight: 700; letter-spacing: .04em; }
.fw-header > b, .fw-banner { white-space: nowrap; }
.fw-hint { flex: 1; min-width: 0; text-align: right; color: #8d99a6; font-size: 12px; }
.fw-whatif .fw-hint { color: #3b2a05; }
.fw-btn, .fw-select { flex: none; width: auto; background: #1b2430; color: #e8eef5; border: 1px solid #33414f; border-radius: 6px; padding: 5px 10px; font: inherit; cursor: pointer; }
.fw-btn[aria-pressed="true"] { background: #2b5f9e; border-color: #4a86d0; }
.fw-tree, .fw-inspector { overflow: auto; padding: 10px 12px; font-size: 13px; background: #0f141b; }
.fw-tree { grid-area: tree; border-right: 1px solid #263241; }
.fw-inspector { grid-area: insp; border-left: 1px solid #263241; }
.fw-title { margin: 2px 0 4px; font-size: 15px; letter-spacing: .03em; }
.fw-sub { margin: 0 0 8px; color: #8d99a6; }
.fw-group { margin: 12px 0 6px; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: #8d99a6; }
.fw-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.fw-row { width: 100%; display: grid; grid-template-columns: 12px auto 1fr; gap: 8px; align-items: center; text-align: left;
  background: transparent; color: inherit; border: 0; border-radius: 5px; padding: 5px 6px; font: inherit; cursor: pointer; }
.fw-row:hover { background: #18212c; } .fw-row.fw-selected { background: #1f3550; }
.fw-id { font-weight: 700; white-space: nowrap; } .fw-label { color: #9fb0c0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fw-dot { width: 9px; height: 9px; border-radius: 50%; background: #4b5b6b; }
.fw-dot-ok { background: #3c9a5f; } .fw-dot-partial { background: #7fae5f; } .fw-dot-alert { background: #f59e12; } .fw-dot-unknown { background: #6b7785; outline: 1px dashed #9fb0c0; }
.fw-kv { width: 100%; border-collapse: collapse; font-size: 12px; } .fw-kv th { text-align: left; color: #9fb0c0; font-weight: 600; padding: 2px 6px 2px 0; vertical-align: top; } .fw-kv td { padding: 2px 0; }
.fw-source { margin: 4px 0; color: #7f8c99; font-size: 11px; }
.fw-prop { border-left: 3px solid #4b5b6b; background: rgba(255, 255, 255, .03); padding: 5px 8px; margin: 4px 0; }
.fw-prop-ok { border-color: #3c9a5f; } .fw-prop-alert { border-color: #f59e12; } .fw-prop-unknown { border-color: #6b7785; } .fw-prop-unmeasured { border-color: #5aa0d6; border-left-style: dashed; }
.fw-prop-head { display: flex; justify-content: space-between; gap: 8px; } .fw-prop-meta { color: #8d99a6; font-size: 11px; margin-top: 2px; }
.fw-src { background: none; border: 0; padding: 0; color: #6fb2ff; font: inherit; text-decoration: underline; cursor: pointer; }
.fw-finding { margin: 6px 0; padding: 6px 8px; border-left: 3px solid #f59e12; color: #ffd08a; font-size: 12px; }
.fw-empty { color: #8d99a6; }
.fw-transport { grid-area: bar; display: flex; gap: 12px; align-items: center; padding: 8px 14px; background: #121821; border-top: 1px solid #263241; }
.fw-transport input[type="range"] { flex: 1; } .fw-clock { font: 600 13px ui-monospace, Menlo, monospace; }
@media (max-width: 900px) {
  .floor3d-workspace { grid-template-columns: 1fr; grid-template-rows: auto 45vh auto auto auto; grid-template-areas: "head" "view" "insp" "tree" "bar"; overflow: auto; }
  .fw-hint { display: none; }
}

/* Regional theater (theater.js): presentation layer, deliberately cinematic and
 * kept visually distinct from the operator displays in ops.css. */
.th-app { --th-ink: #e8eef5; --th-dim: #8fa3b8; --th-accent: #3fd0c9; --th-amber: #ffb547; --th-red: #ff4d4d;
  --th-panel: rgba(9, 17, 29, .82); --th-line: rgba(143, 179, 201, .28);
  /* One screen: the header, an optional what-if banner, the stage and drawer, and the controls. */
  margin: 0; height: 100vh; display: flex; flex-direction: column;
  background: #02060d; color: var(--th-ink); font: 15px/1.45 "SF Pro Text", "Segoe UI", system-ui, sans-serif; }
.th-top { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 10px 20px;
  background: linear-gradient(180deg, #050c18, #03070f); border-bottom: 1px solid var(--th-line); }
.th-brand { display: flex; align-items: center; gap: 10px; font-weight: 800; letter-spacing: .04em; }
.th-mark { display: inline-grid; place-items: center; width: 30px; height: 30px; border-radius: 6px;
  background: linear-gradient(135deg, #3fd0c9, #7a6cff); color: #031014; font-size: 12px; }
.th-mode { font-size: 11px; font-weight: 800; letter-spacing: .1em; padding: 5px 10px; border-radius: 4px; }
.th-mode-briefing { color: #9fe3dc; border: 1px solid #2c6f69; background: #0b2523; }
.th-mode-full { color: #ffd59a; border: 1px solid #8a5a1a; background: #2a1a07; }
.th-body { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) auto; flex: 1 1 auto; min-height: 0; }
.th-stage { position: relative; overflow: hidden; min-height: 420px; }
.th-scene { display: block; width: 100%; height: 100%; position: absolute; inset: 0; }
.th-stage { min-height: 560px; }

/* scenery */
.th-star { fill: #dfe9ff; opacity: .8; }
.th-twinkle { animation: th-twinkle 3.2s ease-in-out infinite; }
.th-tw1 { animation-delay: -1.1s; } .th-tw2 { animation-delay: -2.2s; }
@keyframes th-twinkle { 50% { opacity: .2; } }
.th-aurora { opacity: .55; animation: th-aurora 14s ease-in-out infinite alternate; }
@keyframes th-aurora { from { opacity: .35; transform: translateX(-30px); } to { opacity: .7; transform: translateX(40px); } }
.th-moon { fill: #f6f1df; }
.th-river { fill: none; stroke: url(#th-water); stroke-width: 12; stroke-linecap: round; opacity: .9; }
.th-river-shimmer { fill: none; stroke: #bfe9ff; stroke-width: 2; stroke-dasharray: 3 26; opacity: .55;
  animation: th-flow 2.6s linear infinite; }
@keyframes th-flow { to { stroke-dashoffset: -58; } }
.th-lake { fill: #2c6b93; opacity: .9; } .th-lake-edge { fill: none; stroke: #8fd0f0; stroke-width: 1.4; opacity: .6; }
.th-dam { fill: #8a98a6; stroke: #c6d2dc; stroke-width: 1; } .th-dam-lines { stroke: #5c6a78; stroke-width: 1; }
.th-powerhouse rect, .th-uf-hall rect, .th-pumphouse rect, .th-substation rect { fill: #33414f; stroke: #8fa3b8; stroke-width: 1; }
.th-roof { fill: #263340; stroke: #8fa3b8; stroke-width: 1; }
.th-windows rect { fill: #1b2530; }
.th-windows.th-lit rect { fill: #ffd27a; filter: url(#th-glow); }
.th-turbine circle { fill: none; stroke: #8fa3b8; stroke-width: 1.5; } .th-turbine path { stroke: #8fa3b8; stroke-width: 1.4; }
.th-turbine, .th-rotor { transform-box: fill-box; transform-origin: center; }
.th-spinning { animation: th-spin 1.4s linear infinite; }
.th-spinning circle, .th-spinning path { stroke: #ffd27a !important; }
@keyframes th-spin { to { transform: rotate(360deg); } }
.th-tailrace { fill: none; stroke: #2c6b93; stroke-width: 4; }
.th-tailrace.th-flowing { stroke: #7fd4ff; stroke-dasharray: 6 5; animation: th-flow 1s linear infinite; }
.th-substation path { stroke: #8fa3b8; stroke-width: 1.4; fill: none; }
.th-tower path { fill: none; stroke: #6d8297; stroke-width: 1.4; }
.th-wires path { fill: none; stroke: #6d8297; stroke-width: 1; opacity: .8; }
.th-spark { fill: none; stroke: transparent; stroke-width: 2.4; stroke-dasharray: 3 60; }
.th-sparks.th-on .th-spark { stroke: #ffcf7a; filter: url(#th-glow); animation: th-spark 1.8s linear infinite; }
.th-sparks.th-on .th-spark-1 { animation-delay: -.6s; } .th-sparks.th-on .th-spark-2 { animation-delay: -1.2s; }
@keyframes th-spark { to { stroke-dashoffset: -63; } }
.th-main { fill: none; stroke: #3d93bf; stroke-width: 3; stroke-dasharray: 2 6; opacity: .6; }
.th-edge-label { fill: #8fa3b8; font-size: 11px; font-style: italic; letter-spacing: .02em; }
.th-edge-note { fill: #6f8498; font-size: 10px; font-style: italic; }
.th-intake { stroke: #3d93bf; stroke-width: 3; }
.th-basin { fill: #22303d; stroke: #8fa3b8; }
.th-basin-water { fill: #3d93bf; opacity: .8; animation: th-ripple 3s ease-in-out infinite; }
.th-basin-water.th-still { animation: none; opacity: .5; }
@keyframes th-ripple { 50% { opacity: .55; } }
.th-bubble { fill: #c0b4ff; opacity: 0; }
.th-bubbles.th-on .th-bubble { animation: th-bubble 1.3s ease-in infinite; }
.th-bubbles.th-on .th-b1 { animation-delay: -.4s; } .th-bubbles.th-on .th-b2 { animation-delay: -.8s; }
@keyframes th-bubble { 0% { opacity: 0; transform: translateY(0); } 30% { opacity: .9; } 100% { opacity: 0; transform: translateY(-26px); } }
.th-cmd-tag { opacity: 0; transition: opacity .3s; } .th-cmd-tag.th-on { opacity: 1; }
.th-cmd-tag rect { fill: #1d1736; stroke: #b9a6ff; } .th-cmd-tag text { fill: #cfc3ff; font-size: 9px; font-weight: 800; }
.th-bw-tank rect { fill: #22303d; stroke: #8fa3b8; } .th-bw-fill { fill: #3d93bf; }
.th-legs { stroke: #8fa3b8; stroke-width: 2.4; fill: none; }
.th-tank-shell { fill: #22303d; stroke: #c6d2dc; stroke-width: 1.6; }
.th-tank-fill { fill: #3d93bf; opacity: .9; }
.th-tank-text { fill: #e8eef5; font: 700 13px ui-monospace, Menlo, monospace; }
.th-rotor circle { fill: #22303d; stroke: #8fa3b8; stroke-width: 1.4; } .th-rotor path { stroke: #8fa3b8; stroke-width: 1.4; }
.th-notice rect { fill: #10202c; stroke: #8fa3b8; } .th-envelope { fill: none; stroke: #ffd59a; stroke-width: 1.2; }
.th-notice-text { fill: #e8eef5; font: 600 10px ui-monospace, Menlo, monospace; }
.th-notice.th-expired rect { stroke: #ffb547; stroke-dasharray: 4 3; } .th-notice.th-expired .th-notice-text { fill: #ffb547; }
.th-hidden { display: none; }
.th-unknown { opacity: .9; } .th-hatch-bg { fill: #16222e; } .th-hatch-line { stroke: #7fd4ff; stroke-opacity: .5; stroke-width: 2; }
.th-skijump { fill: #3a4a5a; stroke: #b9c9d9; stroke-width: 1; }
.th-house { fill: #1a2633; stroke: #6f8498; stroke-width: 1; }
.th-light { fill: #2a3542; }
.th-lights.th-on .th-light { fill: #ffd27a; filter: url(#th-glow); }
.th-lights.th-on .th-l1 { fill: #ffe3a3; } .th-lights.th-on .th-l3 { fill: #ffc861; }

/* nodes, halos, beacons, cards */
.th-site { cursor: pointer; }
.th-halo-glow { fill: url(#th-node-glow); opacity: .0; transition: opacity .6s; }
.th-halo-ring { fill: none; stroke: #3fd0c9; stroke-width: 1.4; opacity: .0; stroke-dasharray: 4 6; }
.th-halo.th-idle .th-halo-ring { opacity: .45; }
.th-halo.th-ok .th-halo-glow { opacity: .55; } .th-halo.th-ok .th-halo-ring { opacity: .9; stroke-dasharray: none; }
.th-halo.th-alarm-1 .th-halo-glow { fill: url(#th-alarm-glow); opacity: .9; animation: th-pulse 1.1s ease-in-out infinite; }
.th-halo.th-alarm-2 .th-halo-glow, .th-halo.th-alarm-3 .th-halo-glow { fill: url(#th-warn-glow); opacity: .7; animation: th-pulse 1.8s ease-in-out infinite; }
.th-halo.th-alarm-1 .th-halo-ring { stroke: #ff4d4d; opacity: 1; } .th-halo.th-alarm-2 .th-halo-ring, .th-halo.th-alarm-3 .th-halo-ring { stroke: #ffb547; opacity: 1; }
.th-halo-glow, .th-halo-ring { transform-box: fill-box; transform-origin: center; }
@keyframes th-pulse { 50% { opacity: .35; transform: scale(1.12); } }
.th-beacon { fill: none; stroke-width: 3; transform-box: fill-box; transform-origin: center; animation: th-beacon 1.8s ease-out forwards; }
@keyframes th-beacon { from { opacity: .95; transform: scale(.4); } to { opacity: 0; transform: scale(4.2); } }
.th-beacon-network { stroke: #7aa2c7; } .th-beacon-controller { stroke: #ffd27a; } .th-beacon-device { stroke: #9fe8a8; }
.th-beacon-process { stroke: #c4ccd3; } .th-beacon-service { stroke: #3fd0c9; } .th-beacon-dependency { stroke: #ffb547; }
.th-beacon-operator { stroke: #c0cbff; }
.th-node-label { fill: #e8eef5; font-size: 13px; font-weight: 800; letter-spacing: .12em; paint-order: stroke; stroke: #02060d; stroke-width: 4; }
.th-rail { position: absolute; top: 12px; left: 14px; right: 14px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 12px; pointer-events: none; z-index: 2; }
.th-card { pointer-events: auto; display: grid; gap: 3px; text-align: left; padding: 10px 14px 11px 16px; border-radius: 10px;
  background: rgba(6, 14, 25, .84); color: var(--th-ink); border: 1px solid rgba(143, 179, 201, .35); border-left: 5px solid #6f8498;
  box-shadow: 0 10px 30px rgba(0, 0, 0, .35); backdrop-filter: blur(6px); cursor: pointer; font: inherit; transition: border-color .4s, box-shadow .4s; }
.th-card:hover, .th-card:focus-visible { border-color: #fff; outline: none; }
.th-card-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 3px; }
.th-card-site { color: #3fd0c9; font: 800 12px ui-monospace, Menlo, monospace; }
.th-card-title { flex: 1; font-size: 11px; font-weight: 800; letter-spacing: .09em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.th-card-event { color: #8fa3b8; font: 700 12px ui-monospace, Menlo, monospace; }
.th-card-line { font: 12.5px ui-monospace, Menlo, monospace; color: #cfdbe6; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.th-card-line.th-nodata { color: #7fd4ff; }
.th-card.th-ok { border-left-color: #3fd0c9; }
.th-card.th-alarm-1 { border-left-color: #ff4d4d; border-color: rgba(255, 77, 77, .7); box-shadow: 0 0 26px rgba(255, 77, 77, .35); }
.th-card.th-alarm-2, .th-card.th-alarm-3 { border-left-color: #ffb547; border-color: rgba(255, 181, 71, .6); box-shadow: 0 0 22px rgba(255, 181, 71, .25); }
.th-card.th-selected { border-color: #fff; }

/* overlays, captions */
.th-captions { position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%); width: min(980px, calc(100% - 32px));
  display: flex; flex-direction: column-reverse; gap: 6px; pointer-events: none; }
.th-caption { display: grid; grid-template-columns: auto auto minmax(0, 1fr); gap: 12px; align-items: baseline;
  padding: 9px 14px; border-radius: 8px; background: var(--th-panel); border-left: 4px solid #8fa3b8;
  box-shadow: 0 8px 30px rgba(0, 0, 0, .35); animation: th-caption-in .45s ease-out; }
.th-caption:not(:first-child) { opacity: .55; transform: scale(.98); }
@keyframes th-caption-in { from { opacity: 0; transform: translateY(12px); } }
.th-caption-site { font: 800 12px ui-monospace, Menlo, monospace; color: var(--th-accent); }
.th-caption-time { font: 12px ui-monospace, Menlo, monospace; color: var(--th-dim); }
.th-caption-text { font-size: 16px; font-weight: 600; }
.th-caption-network { border-left-color: #7aa2c7; } .th-caption-controller { border-left-color: #ffd27a; }
.th-caption-device { border-left-color: #9fe8a8; } .th-caption-service { border-left-color: #3fd0c9; }
.th-caption-dependency { border-left-color: #ffb547; } .th-caption-operator { border-left-color: #c0cbff; }
.th-overlay { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; }
.th-intro, .th-ending { pointer-events: auto; text-align: center; max-width: 980px; padding: 34px 40px; border-radius: 16px;
  background: radial-gradient(ellipse at top, rgba(20, 50, 79, .92), rgba(3, 8, 16, .94));
  border: 1px solid rgba(63, 208, 201, .35); box-shadow: 0 30px 90px rgba(0, 0, 0, .6); animation: th-caption-in .8s ease-out; }
.th-intro h1, .th-ending h1 { margin: 6px 0 10px; font-size: clamp(34px, 6vw, 68px); letter-spacing: .14em; line-height: 1.05;
  background: linear-gradient(90deg, #e8eef5, #3fd0c9 55%, #b9a6ff); -webkit-background-clip: text; background-clip: text; color: transparent; }
.th-kicker { margin: 0; color: var(--th-accent); font-size: 12px; font-weight: 800; letter-spacing: .2em; text-transform: uppercase; }
.th-sub { margin: 0 0 8px; color: #cfdbe6; font-size: 19px; }
.th-take { margin: 14px 0 0; color: var(--th-amber); font-weight: 800; letter-spacing: .08em; }
.th-hint { margin: 16px 0 0; color: var(--th-dim); font-size: 12px; }
.th-questions { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin: 14px 0 18px; text-align: left; }
.th-question { padding: 14px; border-radius: 10px; background: rgba(6, 14, 25, .8); border: 1px solid var(--th-line); }
.th-question b { display: block; color: var(--th-accent); font-size: 12px; letter-spacing: .06em; margin-bottom: 6px; }
.th-question p { margin: 0 0 4px; color: #dfe7ef; font-size: 14px; }

/* drawer */
.th-drawer { width: min(720px, 48vw); background: #0a1119; border-left: 1px solid var(--th-line); overflow: auto; min-height: 0; position: relative;
  animation: th-drawer-in .35s ease-out; }
.th-drawer[hidden] { display: none; }
@keyframes th-drawer-in { from { transform: translateX(30px); opacity: 0; } }
.th-drawer-head { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--th-line); }
.th-drawer-title { margin: 0; font-size: 14px; letter-spacing: .08em; text-transform: uppercase; }
.th-drawer-body { padding: 12px; }
.th-drawer .split-title { color: #e8eef5; margin: 4px 0 6px; } .th-drawer .split-floor-title { margin-top: 14px; } .th-drawer .split-floor-title span { color: #c9a227; }
.th-unity { display: inline-block; margin: 0 0 10px; padding: 7px 12px; border-radius: 6px; border: 1px solid #c9a227; color: #ffd27a; font-weight: 800; text-decoration: none; }
.th-unity:hover { background: #2a2208; }
.th-close { background: transparent; color: var(--th-ink); border: 1px solid var(--th-line); border-radius: 6px; padding: 5px 12px; }

/* bottom controls and timeline */
.th-bottom { padding: 10px 20px 14px; background: linear-gradient(0deg, #03070f, #050c18); border-top: 1px solid var(--th-line); }
.th-controls { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 10px; }
.th-play { background: var(--th-accent); color: #031014; border: 0; border-radius: 999px; padding: 8px 22px; font-weight: 800; min-width: 92px; }
.th-btn, .th-seg button { background: transparent; color: #cfdbe6; border: 1px solid var(--th-line); border-radius: 6px; padding: 6px 12px; font-weight: 700; }
.th-btn[aria-pressed="true"] { border-color: var(--th-accent); color: #9fe3dc; }
.th-seg { display: inline-flex; } .th-seg button { border-radius: 0; margin-left: -1px; }
.th-seg button:first-child { border-radius: 6px 0 0 6px; } .th-seg button:last-child { border-radius: 0 6px 6px 0; }
.th-seg button[aria-pressed="true"] { background: #0f2b2a; color: #9fe3dc; border-color: #2c6f69; }
.th-clock { font: 700 16px ui-monospace, Menlo, monospace; color: var(--th-accent); min-width: 88px; }
.th-timeline { position: relative; display: grid; gap: 5px; }
.th-row { display: grid; grid-template-columns: 64px minmax(0, 1fr); align-items: center; }
.th-row-label { font: 800 11px ui-monospace, Menlo, monospace; color: var(--th-dim); }
.th-track { position: relative; height: 18px; border-radius: 4px; background: rgba(143, 179, 201, .08); cursor: pointer; overflow: hidden; }
.th-tick { position: absolute; top: 3px; width: 3px; height: 12px; margin-left: -1px; border-radius: 2px; background: #8fa3b8; }
.th-tick-network { background: #7aa2c7; } .th-tick-controller { background: #ffd27a; } .th-tick-device { background: #9fe8a8; }
.th-tick-service { background: #3fd0c9; } .th-tick-dependency { background: #ffb547; } .th-tick-operator { background: #c0cbff; }
.th-withheld { position: absolute; top: 0; bottom: 0; right: 0; display: flex; align-items: center; padding-left: 10px;
  font-size: 10px; font-weight: 800; letter-spacing: .08em; color: #7fd4ff;
  background: repeating-linear-gradient(45deg, rgba(127, 212, 255, .08) 0 6px, rgba(127, 212, 255, .02) 6px 12px); }
.th-playhead { position: absolute; top: -4px; bottom: -4px; width: 2px; background: #fff; box-shadow: 0 0 10px #3fd0c9; pointer-events: none; }

/* student context banner */
.th-context { position: relative; height: 170px; border-radius: 8px; overflow: hidden; background: #02060d; margin: 0 0 16px; }
.th-context .th-scene { height: 170px; position: static; }
.th-context .th-halo.th-own .th-halo-glow { opacity: .8; } .th-context .th-halo.th-own .th-halo-ring { opacity: 1; stroke-dasharray: none; }
.th-context .th-other-label { fill: #6f8498; }
.th-authority { fill: #8fa3b8; font-size: 12px; font-style: italic; paint-order: stroke; stroke: #02060d; stroke-width: 4; }
.th-own-authority { fill: #3fd0c9; font-style: normal; font-weight: 800; letter-spacing: .14em; }

@media (max-width: 900px) {
  .th-rail { grid-template-columns: 1fr; } .th-card-line:nth-of-type(n+3) { display: none; }
  .th-body { grid-template-columns: 1fr; } .th-drawer { width: 100%; position: absolute; inset: 0 0 auto 0; max-height: 100%; }
  .th-questions { grid-template-columns: 1fr; } .th-caption-text { font-size: 14px; }
}
@media (prefers-reduced-motion: reduce) {
  .th-twinkle, .th-aurora, .th-river-shimmer, .th-spinning, .th-sparks.th-on .th-spark, .th-bubbles.th-on .th-bubble,
  .th-halo-glow, .th-beacon, .th-basin-water, .th-tailrace.th-flowing { animation: none !important; }
}

/* Run banners, staff what-ifs, teams, and the embedded 3D floor. */
.th-whatif-banner { display: flex; gap: 16px; align-items: center; justify-content: center; padding: 8px 16px;
  background: #f59e12; color: #111; font-weight: 800; letter-spacing: .06em; font-size: 13px; }
.th-whatif-banner[hidden] { display: none; }
.th-run-banner { margin: 0 0 10px; padding: 6px 10px; border-radius: 4px; font-size: 12px; font-weight: 800; letter-spacing: .06em;
  border: 1px solid var(--th-line); color: #c8d3de; }
.th-run-banner-whatif { background: #f59e12; color: #111; border-color: #f59e12; }
.th-run-banner-briefing { color: #9fe3dc; border-color: #2c6f69; background: #0b2523; }
.th-btn-whatif { border-color: #b97409; color: #ffd08a; }
.th-whatifs .th-whatif { text-align: left; }
.th-whatif-declared { color: #ffd08a; } .th-whatif-result { color: #e8eef5; font-weight: 600; }
.th-teams { list-style: none; margin: 0 0 12px; padding: 0; display: grid; gap: 6px; }
.th-teams li { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 13px; }
.th-floor3d { padding: 0 12px 12px; }
.th-floor3d[hidden] { display: none; }
.th-floor3d-tools { display: flex; gap: 8px; align-items: center; margin: 6px 0; }
.th-floor3d-title { flex: 1; font-size: 12px; letter-spacing: .06em; color: #c9a227; text-transform: uppercase; }
.th-floor3d-box { position: relative; aspect-ratio: 16 / 9; background: #0b0c0e; border: 1px solid var(--th-line); }
.th-floor3d-large .th-floor3d-box { position: fixed; inset: 64px 24px 150px 24px; aspect-ratio: auto; z-index: 30; }
.th-floor3d-large .th-floor3d-tools { position: fixed; left: 24px; right: 24px; top: 30px; z-index: 31; background: #0a1119; padding: 4px 8px; }
.floor3d-frame { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
.floor3d-status { position: absolute; left: 0; right: 0; bottom: 8px; margin: 0; text-align: center; font-size: 12px; color: #9fb3c8; pointer-events: none; }
.floor3d-off { position: static; padding: 16px; color: #ffd08a; }
.th-ending.th-whatifs { max-width: 1240px; max-height: calc(100% - 150px); overflow: auto; margin-top: 110px; padding: 18px 26px; }
.th-ending.th-whatifs h1 { font-size: 34px; margin: 2px 0 8px; }
.th-whatifs .th-whatif p { font-size: 13px; line-height: 1.4; margin: 6px 0; }
.th-whatifs .th-sub { font-size: 14px; margin: 10px 0 0; }
.th-whatif-banner .th-btn { color: #111; border-color: #111; background: rgba(255, 255, 255, .25); font-weight: 800; }
.th-floor3d.floor3d-workspace { padding: 0; }
.floor3d-workspace > .th-floor3d-tools { display: none; }
.floor3d-workspace > .th-floor3d-box { grid-area: view; aspect-ratio: auto; position: relative; inset: auto; border: 0; }

</style>

        patternTransform: "rotate(45)" }, [
        svg("rect", { width: 8, height: 8, class: "hmi-hatch-bg" }),
        svg("line", { x1: 0, y1: 0, x2: 0, y2: 8, class: "hmi-hatch-line" }),
      ]),
      svg("marker", { id: `${id}-arrow`, viewBox: "0 0 10 10", refX: 9, refY: 5,
        markerWidth: 7, markerHeight: 7, orient: "auto-start-reverse" }, [
        svg("path", { d: "M0,0 L10,5 L0,10 z", class: "hmi-arrowhead" }),
      ]),
    ]);
  }

  /* ---------- primitives ---------- */

  function priorityIcon(x, y, priority, size) {
    const s = size || 9;
    const shape = PRIORITY_SHAPE[priority] || "diamond";
    const d = shape === "diamond" ? `M${x},${y - s} L${x + s},${y} L${x},${y + s} L${x - s},${y} z`
      : shape === "triangle" ? `M${x},${y - s} L${x + s},${y + s * 0.8} L${x - s},${y + s * 0.8} z`
        : `M${x - s},${y - s * 0.6} L${x + s},${y - s * 0.6} L${x},${y + s} z`;
    return svg("g", { class: `hmi-prio hmi-prio-${priority}` }, [
      svg("path", { d }),
      text(x, y + (shape === "triangle" ? s * 0.55 : shape === "chevron" ? 1 : s * 0.35), priority, "hmi-prio-num",
        { "text-anchor": "middle" }),
    ]);
  }

  /* ISA-5.1-style instrument bubble: a horizontal bar marks an operator-accessible
   * display. Letters and loop numbers are fictional. */
  function bubble(x, y, letters, loop, id, quality) {
    return svg("g", { class: `hmi-bubble${quality === "unknown" ? " hmi-unknown" : ""}` }, [
      svg("circle", { cx: x, cy: y, r: 21 }),
      svg("line", { x1: x - 21, y1: y, x2: x + 21, y2: y }),
      text(x, y - 5, letters, "hmi-bubble-letters", { "text-anchor": "middle" }),
      text(x, y + 14, loop, "hmi-bubble-loop", { "text-anchor": "middle" }),
    ]);
  }

  function noData(x, y, w, h, id, label) {
    return svg("g", { class: "hmi-nodata" }, [
      svg("rect", { x, y, width: w, height: h, fill: `url(#${id}-hatch)`, class: "hmi-nodata-box" }),
      text(x + w / 2, y + h / 2 + 4, label || "NO DATA", "hmi-nodata-text", { "text-anchor": "middle" }),
    ]);
  }

  /* Moving analog indicator: scale, pointer, numeric value. No normal band is drawn:
   * the record supplies no operating limits. */
  function analog(x, y, w, cue, opts, t, id) {
    const { min, max, unit, label } = opts;
    const parts = [text(x, y - 8, label, "hmi-label")];
    parts.push(svg("rect", { x, y, width: w, height: 14, class: "hmi-analog-track" }));
    const ticks = opts.ticks || 4;
    for (let i = 0; i <= ticks; i += 1) {
      const tx = x + (w * i) / ticks;
      parts.push(svg("line", { x1: tx, y1: y + 14, x2: tx, y2: y + 19, class: "hmi-tick" }));
      parts.push(text(tx, y + 30, Math.round(min + ((max - min) * i) / ticks), "hmi-scale", { "text-anchor": "middle" }));
    }
    if (!known(cue)) {
      parts.push(noData(x, y, w, 14, id));
      parts.push(text(x + w + 10, y + 12, "NO DATA", "hmi-value hmi-quality"));
    } else {
      const ratio = Math.max(0, Math.min(1, (Number(cue.v) - min) / (max - min)));
      const px = x + w * ratio;
      parts.push(svg("rect", { x, y: y + 3, width: Math.max(0, px - x), height: 8, class: "hmi-analog-fill" }));
      parts.push(svg("path", { d: `M${px},${y - 1} L${px - 6},${y - 9} L${px + 6},${y - 9} z`, class: "hmi-pointer" }));
      parts.push(text(x + w + 10, y + 12, `${cue.v} ${unit}`, "hmi-value"));
      parts.push(text(x + w + 10, y + 28, stamp(cue, t), "hmi-stamp"));
    }
    return svg("g", { class: "hmi-analog" }, parts);
  }

  function tank(x, y, w, h, cue, opts, t, id) {
    const parts = [svg("rect", { x, y, width: w, height: h, rx: 6, class: "hmi-tank" })];
    if (!known(cue)) {
      parts.push(noData(x + 3, y + 3, w - 6, h - 6, id));
    } else {
      const ratio = Math.max(0, Math.min(1, (Number(cue.v) - opts.min) / (opts.max - opts.min)));
      const fh = (h - 6) * ratio;
      parts.push(svg("rect", { x: x + 3, y: y + h - 3 - fh, width: w - 6, height: fh, class: "hmi-tank-fill" }));
      parts.push(svg("line", { x1: x + 3, y1: y + h - 3 - fh, x2: x + w - 3, y2: y + h - 3 - fh, class: "hmi-tank-surface" }));
    }
    parts.push(text(x + w / 2, y + h + 18, opts.label, "hmi-equip-label", { "text-anchor": "middle" }));
    return svg("g", {}, parts);
  }

  function pipe(points, cls, id) {
    return svg("polyline", { points: points.map((p) => p.join(",")).join(" "), class: `hmi-pipe ${cls || ""}`,
      "marker-end": cls && cls.includes("arrow") ? `url(#${id}-arrow)` : null });
  }

  /* One-line breaker symbol: filled = closed, hollow = open, hatched = no feedback. */
  function breaker(x, y, cue, tripCue, label, id) {
    const parts = [];
    if (!known(cue)) {
      parts.push(svg("rect", { x: x - 20, y: y - 20, width: 40, height: 40, class: "hmi-breaker hmi-breaker-unknown" }));
      parts.push(noData(x - 18, y - 18, 36, 36, id, "?"));
    } else {
      parts.push(svg("rect", { x: x - 20, y: y - 20, width: 40, height: 40,
        class: `hmi-breaker ${cue.v ? "hmi-closed" : "hmi-open"}${known(tripCue) && tripCue.v ? " hmi-alarm-1" : ""}` }));
      if (!cue.v) parts.push(svg("line", { x1: x - 12, y1: y + 12, x2: x + 12, y2: y - 12, class: "hmi-open-bar" }));
    }
    parts.push(text(x, y - 28, label, "hmi-equip-label", { "text-anchor": "middle" }));
    return svg("g", {}, parts);
  }

  /* Pump symbol. Its state comes only from a feedback cue; a command alone leaves
   * the symbol hollow with a CMD tag. */
  function pump(x, y, feedback, command, label, id) {
    const running = known(feedback) && feedback.v === true;
    const parts = [svg("circle", { cx: x, cy: y, r: 26, class: `hmi-pump${running ? " hmi-running" : ""}` }),
      svg("path", { d: `M${x - 14},${y + 16} L${x + 20},${y} L${x - 14},${y - 16}`, class: "hmi-pump-mark" })];
    if (!known(feedback)) parts.push(noData(x - 13, y + 32, 26, 12, id, ""));
    if (known(command) && command.v === true) {
      parts.push(svg("rect", { x: x + 22, y: y - 34, width: 38, height: 16, rx: 3, class: "hmi-cmd-tag" }));
      parts.push(text(x + 41, y - 22, "CMD", "hmi-cmd-tag-text", { "text-anchor": "middle" }));
    }
    parts.push(text(x, y + 62, label, "hmi-equip-label", { "text-anchor": "middle" }));
    return svg("g", {}, parts);
  }

  function valve(x, y, command, label) {
    const open = known(command) && command.v === true;
    return svg("g", {}, [
      svg("path", { d: `M${x - 16},${y - 11} L${x + 16},${y + 11} L${x + 16},${y - 11} L${x - 16},${y + 11} z`,
        class: `hmi-valve${known(command) ? (open ? " hmi-valve-cmd-open" : " hmi-valve-cmd-closed") : " hmi-unknown"}` }),
      text(x, y - 18, label, "hmi-equip-label", { "text-anchor": "middle" }),
    ]);
  }

  /* Synchroscope (25-H1): pointer at the phase angle across the open breaker, 0 deg at top.
   * Once closed it reads 0; the close record, when there is one, is printed under it. */
  function synchroscope(x, y, r, phase, closeRecord, t, id) {
    const parts = [svg("circle", { cx: x, cy: y, r, class: "hmi-sync-face" }),
      svg("line", { x1: x, y1: y - r, x2: x, y2: y - r + 6, class: "hmi-tick" }),
      text(x, y + r + 14, "25-H1 SYNCHROSCOPE", "hmi-label", { "text-anchor": "middle" })];
    if (!known(phase)) {
      parts.push(noData(x - r * 0.7, y - 8, r * 1.4, 16, id));
    } else {
      const a = (Number(phase.v) * Math.PI) / 180;
      parts.push(svg("line", { x1: x, y1: y, x2: x + (r - 4) * Math.sin(a), y2: y - (r - 4) * Math.cos(a), class: "hmi-sync-pointer" }));
      parts.push(text(x, y + r + 28, `${phase.v}° · ${phase.src}`, "hmi-stamp", { "text-anchor": "middle" }));
    }
    parts.push(text(x, y + r + 42, known(closeRecord) ? `close record ${closeRecord.v}° · ${closeRecord.src}` : "no close record",
      known(closeRecord) ? "hmi-stamp" : "hmi-stamp hmi-quality", { "text-anchor": "middle" }));
    return svg("g", {}, parts);
  }

  /* A compact labelled reading: value with unit, or NO DATA. */
  function reading(x, y, label, cue, unit) {
    return text(x, y, `${label} ${known(cue) ? `${cue.v} ${unit}` : "NO DATA"}`, known(cue) ? "hmi-row-value" : "hmi-row-value hmi-quality");
  }

  /* Faceplate: labelled rows that keep request, decision, command, and feedback apart. */
  function faceplate(x, y, w, title, rows, t, id, options) {
    const rowH = (options && options.rowH) || 38;
    const titleH = (options && options.titleH) || 30;
    const kindY = (rowH - 16) / 2 - 3; const labelY = kindY + 8; const stampY = rowH - 7;
    const parts = [svg("rect", { x, y, width: w, height: titleH + rows.length * rowH, rx: 4, class: "hmi-faceplate" }),
      text(x + 12, y + titleH - 10, title, "hmi-faceplate-title")];
    rows.forEach((row, i) => {
      const ry = y + titleH + i * rowH;
      parts.push(svg("line", { x1: x, y1: ry, x2: x + w, y2: ry, class: "hmi-faceplate-rule" }));
      parts.push(svg("rect", { x: x + 10, y: ry + kindY, width: 44, height: 16, rx: 2, class: `hmi-kind hmi-kind-${row.kind}` }));
      parts.push(text(x + 32, ry + kindY + 12, row.kind.toUpperCase().slice(0, 4), "hmi-kind-text", { "text-anchor": "middle" }));
      parts.push(text(x + 64, ry + labelY, row.label, "hmi-row-label"));
      const cue = row.cue;
      if (row.wide) {
        const shown = known(cue) ? String(row.format ? row.format(cue.v) : cue.v) : "NO DATA";
        const clipped = shown.length > row.wide ? `${shown.slice(0, row.wide - 1)}…` : shown;
        parts.push(text(x + w - 12, ry + labelY, known(cue) ? cue.src : "", "hmi-stamp", { "text-anchor": "end" }));
        parts.push(text(x + 64, ry + stampY, clipped, `hmi-row-text${known(cue) ? "" : " hmi-quality"}`));
        return;
      }
      let value; let cls = "hmi-row-value";
      if (row.fixed) { value = row.fixed; cls += " hmi-quality"; }
      else if (!known(cue)) { value = "NO DATA"; cls += " hmi-quality"; }
      else {
        value = row.format ? row.format(cue.v) : upper(cue.v);
        if (cue.q === "expired") { value += " · EXPIRED"; cls += " hmi-expired-text"; }
        if (row.abnormal && row.abnormal(cue.v)) cls += " hmi-abnormal";
      }
      parts.push(text(x + w - 12, ry + labelY, value, cls, { "text-anchor": "end" }));
      parts.push(text(x + 64, ry + stampY, row.fixed ? row.fixedNote || "" : stamp(cue, t), "hmi-stamp"));
    });
    return svg("g", {}, parts);
  }

  function annunciator(x, y, tiles) {
    const w = 118; const h = 34;
    return svg("g", {}, tiles.map((tile, i) => {
      const tx = x + (i % 2) * (w + 6); const ty = y + Math.floor(i / 2) * (h + 6);
      return svg("g", { class: `hmi-annun${tile.on ? ` hmi-annun-on hmi-alarm-${tile.priority || 3}` : ""}` }, [
        svg("rect", { x: tx, y: ty, width: w, height: h, rx: 2 }),
        text(tx + w / 2, ty + 21, tile.label, "hmi-annun-text", { "text-anchor": "middle" }),
      ]);
    }));
  }

  function sparkline(x, y, w, h, bundle, cueId, t, opts) {
    const points = [];
    for (const frame of bundle.frames) {
      if (frame.t > t) break;
      const cue = frame.cues[cueId];
      if (known(cue)) points.push([frame.t, Number(cue.v)]);
    }
    const sx = (time) => x + (w * time) / Math.max(1, bundle.duration_s);
    const sy = (v) => y + h - (h * (v - opts.min)) / (opts.max - opts.min);
    const parts = [svg("rect", { x, y, width: w, height: h, class: "hmi-trend" }),
      text(x + 4, y - 6, opts.label, "hmi-label")];
    if (points.length) {
      let d = `M${sx(points[0][0])},${sy(points[0][1])}`;
      for (let i = 1; i < points.length; i += 1) d += ` H${sx(points[i][0])} V${sy(points[i][1])}`;
      d += ` H${sx(t)}`;
      parts.push(svg("path", { d, class: "hmi-trend-line" }));
    } else {
      parts.push(text(x + w / 2, y + h / 2 + 4, "NO OBSERVATIONS YET", "hmi-nodata-text", { "text-anchor": "middle" }));
    }
    parts.push(svg("line", { x1: sx(t), y1: y, x2: sx(t), y2: y + h, class: "hmi-trend-now" }));
    return svg("g", {}, parts);
  }

  /* ---------- common chrome ---------- */

  /* Data-source badge: the realization (controller runtime) that produced this record. */
  function sourceBadge(bundle) {
    const label = (bundle.realization && bundle.realization.label) || "REPLAY";
    const take = bundle.take ? (bundle.take === "take2" ? "TAKE 2" : "TAKE 1") : null;
    const control = bundle.control ? (bundle.control.enabled ? "CONTROL ON" : "CONTROL OFF") : null;
    return [label, take, control].filter(Boolean).join(" · ");
  }

  function header(bundle, frame, t, meta) {
    return svg("g", {}, [
      svg("rect", { x: 0, y: 0, width: 1000, height: 34, class: "hmi-header" }),
      text(14, 22, (bundle.profile && bundle.profile.title) || meta.title, "hmi-title"),
      text(560, 22, `${clock(t)}${frame.event ? ` · ${frame.event}` : ""}`, "hmi-clock", { "text-anchor": "middle" }),
      svg("rect", { x: 706, y: 7, width: 280, height: 20, rx: 3, class: "hmi-mode-badge" }),
      text(846, 21, sourceBadge(bundle), "hmi-mode-text", { "text-anchor": "middle" }),
    ]);
  }

  function alarmBanner(frame, t) {
    const parts = [svg("rect", { x: 0, y: 38, width: 1000, height: 38, class: "hmi-alarm-banner" })];
    if (!frame.alarms.length) {
      parts.push(text(16, 62, "NO ACTIVE ALARMS IN THE RECORD", "hmi-alarm-none"));
    }
    frame.alarms.slice(0, 3).forEach((alarm, i) => {
      const ax = 18 + i * 328;
      parts.push(svg("g", { class: "hmi-alarm-item" }, [
        priorityIcon(ax + 8, 57, alarm.priority),
        text(ax + 24, 62, alarm.text, `hmi-alarm-text hmi-alarm-${alarm.priority}`),
        text(ax + 24, 73, `${alarm.src} · last recorded ${Math.round(t - alarm.at)} s ago`, "hmi-alarm-stamp"),
      ]));
    });
    return svg("g", { class: "hmi-alarms" }, parts);
  }

  function chainStrip(bundle, frame, onJump) {
    const steps = bundle.chain;
    const w = 172; const gap = 25; const x0 = 18; const y = 408;
    const parts = [text(18, 400, "EVIDENCE CHAIN · cite these record IDs", "hmi-label")];
    steps.forEach((step, i) => {
      const x = x0 + i * (w + gap);
      const state = frame.chain ? frame.chain[step.step] : null;
      const cls = !state ? "hmi-chain-pending" : state.current ? "hmi-chain-current" : "hmi-chain-prior";
      const node = svg("g", { class: `hmi-chain ${cls}`, tabindex: state ? 0 : null, role: state ? "button" : null,
        "aria-label": state ? `${step.label}: record ${state.event} at ${state.t} seconds` : `${step.label}: not yet in the record` }, [
        svg("rect", { x, y, width: w, height: 68, rx: 5 }),
        text(x + 10, y + 18, `${i + 1}  ${step.label.toUpperCase()}`, "hmi-chain-label"),
        text(x + 10, y + 45, state ? state.event : "—", "hmi-chain-event"),
        text(x + w - 10, y + 45, state ? `+${state.t} s` : "pending", "hmi-chain-time", { "text-anchor": "end" }),
        text(x + 10, y + 60, state ? (state.current ? "current attempt" : "prior attempt") : "not yet recorded", "hmi-chain-note"),
      ]);
      if (state && onJump) {
        node.addEventListener("click", () => onJump(state.t));
        node.addEventListener("keydown", (event) => {
          if (event.key === "Enter" || event.key === " ") { event.preventDefault(); onJump(state.t); }
        });
      }
      parts.push(node);
      if (i < steps.length - 1) {
        parts.push(svg("line", { x1: x + w + 3, y1: y + 34, x2: x + w + gap - 3, y2: y + 34, class: "hmi-chain-arrow",
          "marker-end": `url(#${bundle.__id}-arrow)` }));
      }
    });
    return svg("g", {}, parts);
  }

  function legend(bundle) {
    const y = 500;
    return svg("g", { class: "hmi-legend" }, [
      svg("rect", { x: 18, y: y, width: 14, height: 14, class: "hmi-breaker hmi-closed" }),
      text(38, y + 12, "closed / running (feedback)", "hmi-legend-text"),
      svg("rect", { x: 220, y: y, width: 14, height: 14, class: "hmi-breaker hmi-open" }),
      text(240, y + 12, "open / stopped", "hmi-legend-text"),
      svg("rect", { x: 358, y: y, width: 14, height: 14, fill: `url(#${bundle.__id}-hatch)`, class: "hmi-nodata-box" }),
      text(378, y + 12, "not in record", "hmi-legend-text"),
      svg("rect", { x: 482, y: y, width: 14, height: 14, class: "hmi-expired-box" }),
      text(502, y + 12, "expired notice", "hmi-legend-text"),
      svg("line", { x1: 606, y1: y + 7, x2: 632, y2: y + 7, class: "hmi-pipe hmi-water-line hmi-cmd-flow" }),
      text(638, y + 12, "commanded, not measured", "hmi-legend-text"),
      priorityIcon(806, y + 7, 1, 7), priorityIcon(826, y + 7, 2, 7), priorityIcon(846, y + 7, 3, 7),
      text(862, y + 12, "alarm priority 1 / 2 / 3", "hmi-legend-text"),
      text(18, y + 36, `Training mimic, not a facility screen · data: ${(bundle.realization && bundle.realization.runtime) || "replay"} · tags are fictional · gray is normal, color is abnormal`, "hmi-disclaimer"),
    ]);
  }

  /* ---------- utility layouts ---------- */

  const yes = (on, off) => (value) => (value ? on : off);

  function drawHydro(g, bundle, frame, t, id) {
    const c = (cueId) => frame.cues[cueId];
    const closed = known(c("h1_52g_closed")) && c("h1_52g_closed").v;
    const generating = known(c("h1_generation_mw")) && Number(c("h1_generation_mw").v) > 0;
    g.append(
      text(18, 100, "UNIT H1 · ONE-LINE", "hmi-section"),
      svg("path", { d: "M24,150 Q60,128 112,150 L112,268 L24,268 z", class: "hmi-water" }),
      text(68, 290, "RESERVOIR", "hmi-equip-label", { "text-anchor": "middle" }),
      pipe([[112, 230], [196, 230]], `hmi-penstock${generating ? " hmi-flowing" : ""}`, id),
      svg("circle", { cx: 236, cy: 230, r: 38, class: `hmi-generator${generating ? " hmi-running" : ""}` }),
      text(236, 238, "G", "hmi-generator-mark", { "text-anchor": "middle" }),
      text(236, 182, "UNIT H1", "hmi-equip-label", { "text-anchor": "middle" }),
      pipe([[274, 230], [340, 230]], `hmi-bus${closed && generating ? " hmi-energized" : ""}`, id),
      breaker(360, 230, c("h1_52g_closed"), c("h1_52g_trip"), "52G-H1", id),
      pipe([[380, 230], [440, 230]], `hmi-bus${closed && generating ? " hmi-energized" : ""}`, id),
      svg("circle", { cx: 458, cy: 230, r: 18, class: "hmi-xfmr" }),
      svg("circle", { cx: 480, cy: 230, r: 18, class: "hmi-xfmr" }),
      text(469, 270, "GSU T1", "hmi-equip-label", { "text-anchor": "middle" }),
      pipe([[498, 230], [600, 230]], `hmi-bus arrow${closed && generating ? " hmi-energized" : ""}`, id),
      text(604, 222, "REGIONAL", "hmi-edge-label"),
      text(604, 236, "SERVICE", "hmi-edge-label"),
      text(604, 250, "(authored edge)", "hmi-edge-note"),
      bubble(236, 316, "JI", "101", id, c("h1_generation_mw").q),
      analog(278, 316, 160, c("h1_generation_mw"), { min: 0, max: 5, ticks: 5, unit: "MW", label: "H1 GENERATION" }, t, id),
      sparkline(24, 354, 170, 26, bundle, "h1_generation_mw", t, { min: 0, max: 5, label: "MW TREND" }),
      synchroscope(470, 136, 26, c("h1_phase_angle"), c("h1_close_angle"), t, id),
      reading(512, 118, "GEN", c("h1_gen_freq_hz"), "Hz"),
      reading(512, 132, "BUS", c("h1_bus_freq_hz"), "Hz"),
      reading(512, 146, "GEN", c("h1_gen_voltage_pu"), "pu"),
      reading(512, 160, "BUS", c("h1_bus_voltage_pu"), "pu"),
      reading(160, 128, "SPEED", c("h1_speed_pct"), "%"),
      faceplate(682, 86, 300, "52G-H1 · RESET / CLOSE CONTROL", [
        { kind: "req", label: "Reset request", cue: c("h1_reset_request"), format: () => "RECEIVED" },
        { kind: "dec", label: "Controller permissive", cue: c("h1_reset_permit"), format: yes("ALLOWED", "DENIED"),
          abnormal: (v) => !v },
        { kind: "dec", label: "Decision reason", cue: c("h1_permit_reason"), wide: 37 },
        { kind: "fbk", label: "52G contact feedback", cue: c("h1_52g_closed"), format: yes("CLOSED", "OPEN") },
      ], t, id),
      annunciator(682, 296, [
        { label: "UNIT TRIP", on: known(c("h1_unit_alarm")) && c("h1_unit_alarm").v === "trip", priority: 1 },

  /* Condition properties (the use case's device models), any floor cue the scene lists but does
   * not draw, and the record's findings: the same rows the 3D floor shows, in text. */
  function conditionRows(bundle, cues, t, extra) {
    const rows = [];
    for (const system of (bundle.plant && bundle.plant.systems) || []) {
      for (const prop of system.properties || []) {
        if (!prop.cue || !(prop.condition || (extra || []).includes(prop.cue))) continue;
        const cue = cues[prop.cue];
        const what = prop.condition ? `${system.id} ${prop.condition}`
          : `${prop.id.split("#")[0]} ${(prop.id.split("#")[1] || "").replaceAll("-", " ")}${prop.observedBy ? ` (${prop.observedBy})` : ""}`;
        const value = !known(cue) ? "NO DATA" : typeof cue.v === "number" ? `${cue.v}` : String(cue.v).toUpperCase();
        rows.push({ text: `${what}: ${value}${known(cue) ? ` · ${cue.src} · ${cue.class || ""}` : ""}`,
          state: !known(cue) ? "unknown" : ["normal", "intact", "none", "in-spec", "stable"].includes(cue.v) ? "ok"
            : prop.condition ? "alert" : "value" });
      }
    }
    for (const f of bundle.findings || []) {
      if (f.t <= t) rows.push({ text: `FINDING +${f.t} s · ${f.device}: ${f.text}`, state: "finding" });
    }
    return rows;
  }

  /* ---------- semantics shown at each node (from cue frames only) ---------- */

  const decisionLine = (permit, reason, waiting) => {
    if (known(permit)) return `${permit.v ? "PERMITTED" : "DENIED"} · ${known(reason) ? reason.v : ""} · ${permit.src}`;
    return waiting ? "Decision: PENDING" : "Decision: —";
  };

  function status(utility, frame) {
    const c = frame.cues;
    if (utility === "hydro") {
      const brk = c.h1_52g_closed; const mw = c.h1_generation_mw;
      return [
        known(brk) ? `52G feedback: ${brk.v ? "CLOSED" : "OPEN"} · ${brk.src}` : "52G feedback: NOT IN RECORD",
        decisionLine(c.h1_reset_permit, c.h1_permit_reason, known(c.h1_reset_request)),
        known(mw) ? `Generation: ${mw.v} MW · ${mw.src}` : "Generation: NO DATA",
      ];
    }
    if (utility === "treatment") {
      const phase = c.p3_phase; const level = c.p3_bw_tank_level;
      return [
        known(phase) ? `Phase (CMD): ${phase.v} · ${phase.src}` : "Phase: NO DATA",
        decisionLine(c.p3_controller_allowed, c.p3_permit_reason, known(c.p3_transition_due)),
        known(level) ? `BW tank: ${level.v} mm · ${level.src}` : "BW tank: NO DATA",
      ];
    }
    const run = c.wd_p1_running; const notice = c.wd_power_notice_kw;
    return [
      known(run) ? `Pump 1 feedback: ${run.v ? "RUNNING" : "STOPPED"} · ${run.src}` : "Pump 1 feedback: NOT IN RECORD",
      decisionLine(c.wd_restart_permit, c.wd_permit_reason, known(c.wd_restart_request)),
      !known(notice) ? "Power notice: NO DATA" : notice.q === "expired" ? `Notice ${notice.v} kW: EXPIRED`
        : `Notice ${notice.v} kW · supplied · ${notice.src}`,
    ];
  }

  function caption(utility, event, frame) {
    const d = event ? event.detail : {};
    if (!event) return frame && frame.note ? "Site power notice EXPIRED: its validity window elapsed" : "";
    switch (event.kind) {
      case "regional_context": return "Regional context supplied (authored scenario input)";
      case "reset_request_received": return "Reset request RECEIVED at the controller. Received is not closed.";
      case "authorization": return `Controller ${d.allowed ? "PERMITS" : "DENIES"}: ${d.reason}`;
      case "actual_contact": return d.trip ? "52G TRIPPED on close" : `52G contact feedback: ${d.closed ? "CLOSED" : "still OPEN"}`;
      case "unit_indication": return `Unit indication: ${d.generation_mw} MW · ${String(d.alarm).toUpperCase()}`;
      case "equipment_check": return `Local equipment check recorded: ${d.finding}`;
      case "generation_result": return `Generation restored: ${d.generation_mw} MW`;
      case "maintenance_request": return `Maintenance consultation requested: ${d.scope}`;
      case "virtual_access_event": return `Virtual SME session ${String(d.state).toUpperCase()}: consultation only, not controller authority`;
      case "filter_timer_due": return `Backwash transition DUE · backwash tank ${d.bw_tank_level_mm} mm`;
      case "uf_phase_outputs": return `Phase outputs (commands): ${d.p3_state}`;
      case "backwash_indication": return d.cycle_supported ? "Backwash cycle supported · water quality not modeled" : "Backwash cycle NOT supported · water quality not modeled";
      case "protective_stop": return `PROTECTIVE STOP: ${d.reason}`;
      case "backwash_tank_replenished": return `Backwash tank replenished to ${d.bw_tank_level_mm} mm`;
      case "filtration_resumed": return "Filtration resumed";
      case "site_power_notice": return `Site power notice supplied: ${d.available_kw} kW until +${d.valid_until_s} s (not a measured feeder)`;
      case "notice_refresh": return `Notice refreshed: ${d.available_kw} kW until +${d.valid_until_s} s`;
      case "pump_restart_request_received": return "Pump restart request RECEIVED at the controller";
      case "actual_pump_state": return d.protective_stop ? "Pump 1 PROTECTIVE STOP" : `Pump 1 run feedback: ${d.running ? "RUNNING" : "STOPPED"}`;
      case "storage_indication": return `Storage ${d.storage_pct}% · pressure ${String(d.pressure).toUpperCase()}`;
      case "pressure_result": return `Useful pressure restored · storage ${d.storage_pct}%`;
      case "consequence": return `${d.feature} ${String(d.condition)}: ${String(d.state).toUpperCase()} (device model ${d.madeBy || ""})`;
      case "sync_measurement": return `25-H1 close record: contact angle ${d.close_angle_deg}° (declared)`;
      default: return String(event.kind).replaceAll("_", " ");
    }
  }

  /* ---------- the theater ---------- */

  class Theater {
    constructor(container, bundle) {
      this.bundle = bundle;
      this.view = bundle.view;
      this.briefing = bundle.view === "briefing";
      this.whatif = null;     // a staff what-if replacing its base utility's run, under its banner
      this.floor3d = null;    // the embedded 3D floor (Unity), when the theater ships the builds
      this.rate = 0;
      this.take = bundle.takes[0];
      this.controls = { hydro: false, treatment: false, distribution: false };
      this.t = 0; this.speed = 4; this.playing = false; this.director = true;
      this.camera = { x: 0, y: 0, w: W, h: H }; this.target = { ...this.camera };
      this.queue = []; this.focus = null; this.focusUntil = 0; this.selected = null;
      this.captions = [];
      this.build(container);
      this.applyRuns();
      this.seek(0);
      this.loop = this.loop.bind(this);
      requestAnimationFrame(this.loop);
    }

    runs() {
      const result = {};
      for (const u of UTILITIES) result[u] = this.bundle.runs[`${u}/${this.take}/${this.controls[u] ? "on" : "off"}`];
      if (this.whatif) result[this.whatif.base.utility] = this.whatif.run;
      return result;
    }

    build(container) {
      container.classList.add("th-app");
      const top = html("header", { class: "th-top" }, [
        html("div", { class: "th-brand" }, [html("span", { class: "th-mark", text: "AS" }),
          html("span", { text: "Operation Alpine Shield · Regional Operations Theater" })]),
        html("div", { class: `th-mode ${this.briefing ? "th-mode-briefing" : "th-mode-full"}`, text: MODE_LABEL[this.view] }),
      ]);
      this.whatifBanner = html("div", { class: "th-whatif-banner", hidden: true });
      this.stage = html("div", { class: "th-stage" });
      this.scene = buildScene(this.stage);
      this.scene.root.setAttribute("preserveAspectRatio", "xMidYMid slice");
      this.cards = {};
      const rail = html("div", { class: "th-rail" });
      for (const u of UTILITIES) {
        this.cards[u] = card(u);
        rail.append(this.cards[u].g);
        this.cards[u].g.addEventListener("click", () => this.select(u));
      }
      this.stage.querySelectorAll(".th-site").forEach((site) => site.addEventListener("click", () => this.select(site.dataset.node)));
      this.captionBox = html("div", { class: "th-captions", "aria-live": "polite" });
      this.overlay = html("div", { class: "th-overlay" });
      this.stage.append(rail, this.captionBox, this.overlay);

      this.drawer = html("aside", { class: "th-drawer", "aria-label": "Operator display", hidden: true });
      const close = html("button", { type: "button", class: "th-close", text: "Close" });
      close.addEventListener("click", () => this.select(null));
      this.drawerTitle = html("h2", { class: "th-drawer-title" });
      this.drawerBody = html("div", { class: "th-drawer-body" });
      this.drawer.append(html("div", { class: "th-drawer-head" }, [this.drawerTitle, close]), this.drawerBody);

      this.timeline = html("div", { class: "th-timeline" });
      this.playhead = html("div", { class: "th-playhead" });
      this.controlsBar = html("div", { class: "th-controls" });
      const bottom = html("footer", { class: "th-bottom" }, [this.controlsBar, this.timeline]);
      this.floor3dHost = html("div", { class: "th-floor3d", hidden: true });
      this.drawer.insertBefore(this.floor3dHost, this.drawerBody);
      container.append(top, this.whatifBanner, html("div", { class: "th-body" }, [this.stage, this.drawer]), bottom);
      this.buildControls();
      document.addEventListener("keydown", (e) => this.key(e));
      this.showIntro();
    }

    buildControls() {
      const bar = this.controlsBar;
      bar.replaceChildren();
      this.playButton = html("button", { type: "button", class: "th-play", text: "Play" });
      this.playButton.addEventListener("click", () => (this.playing ? this.pause() : this.play()));
      const restart = html("button", { type: "button", class: "th-btn", text: "Restart" });
      restart.addEventListener("click", () => { this.overlay.replaceChildren(); this.seek(0); this.play(); });
      this.clockLabel = html("span", { class: "th-clock", text: clock(0) });
      const speeds = html("div", { class: "th-seg", role: "group", "aria-label": "Speed" });
      [1, 4, 10].forEach((s) => {
        const b = html("button", { type: "button", text: `${s}×`, "aria-pressed": String(s === this.speed) });
        b.addEventListener("click", () => { this.speed = s; speeds.querySelectorAll("button").forEach((x) => x.setAttribute("aria-pressed", String(x === b))); });
        speeds.append(b);
      });
      const director = html("button", { type: "button", class: "th-btn", "aria-pressed": "true", text: "Director" });
      director.addEventListener("click", () => {

    leaveWhatif() {

    applyRuns() {
      this.current = this.runs();
      this.duration = Math.max(...UTILITIES.map((u) => this.current[u].duration_s)) + (this.briefing ? 6 : 4);

    showIntro() {

            html("b", { text: `${NODES[u].site} · ${NODES[u].title}` }), html("p", { text: STAGE_QUESTION[u] })]))),

        html("p", { class: "th-kicker", text: `End of replay · ${this.take === "take1" ? "Take 1" : "Take 2"}` }),
        html("h1", { text: "WHAT THE RECORD SHOWS" }), html("div", { class: "th-questions" }, rows),

    play() {

    }

    pause() { this.playing = false; this.playButton.textContent = "Play"; }

    seek(t) {
      this.t = Math.max(0, Math.min(this.duration, t));

    select(utility) {
      if (!utility || !UTILITIES.includes(utility)) {
        this.selected = null; this.drawer.hidden = true; this.overview();
        if (this.floor3dWorkspace) { this.floor3dWorkspace.close(); this.floor3dWorkspace = null; }
        if (this.floor3d) { this.floor3d.close(); this.floor3d = null; this.floor3dHost.hidden = true; }

        tools.append(html("span", { class: "th-floor3d-title", text: "3D floor · model rendering of the same record" }), tour, large, workspaceButton);

        this.floor3d.follow(() => ({ t: this.t, playing: this.playing, speed: this.playing ? (this.rate || this.speed) : this.speed }));
