    teamRows(utility) {
      const teams = this.bundle.teams && this.bundle.teams[utility];
      if (!teams || !teams.length) return [];
      const rows = teams.map((team) => {
        const play = html("button", { type: "button", class: "th-btn", text: `Play ${team.team_id}` });
        play.addEventListener("click", () => {
          if (this.whatif) this.leaveWhatif();
          this.controls[utility] = team.control_enabled;
          this.syncControlButtons();
          this.applyRuns(); this.seek(0); this.play();
        });
        return html("li", {}, [html("span", { text: `${team.team_id} · control ${team.control_enabled ? "ON" : "OFF"} · service ${team.useful_service ? "delivered" : "not delivered"}` }), play]);
      });
      return [html("h4", { class: "split-title" }, [html("span", { text: "Teams · Take 1 official runs" }),
        html("small", { text: "each run depends only on its control choice" })]), html("ul", { class: "th-teams" }, rows)];
    }

    syncControlButtons() {
      this.controlsBar.querySelectorAll("[data-control]").forEach((b) => b.setAttribute("aria-pressed", String(this.controls[b.dataset.control])));
    }

    focusOn(utility, zoom) {
      const n = NODES[utility] || NODES.consumers;
      const w = W / (zoom || 2.1); const h = H / (zoom || 2.1);
      this.target = { x: Math.max(0, Math.min(W - w, n.x - w / 2)), y: Math.max(0, Math.min(H - h, n.y - h * 0.52)), w, h };
    }

    overview() { this.target = { x: 0, y: 0, w: W, h: H }; }

    key(e) {
      if (e.target && ["INPUT", "TEXTAREA", "SELECT"].includes(e.target.tagName)) return;
      if (e.key === " ") { e.preventDefault(); this.playing ? this.pause() : this.play(); }
      else if (e.key === "ArrowRight" || e.key === "ArrowLeft") { e.preventDefault(); this.stepEvent(e.key === "ArrowRight" ? 1 : -1); }
      else if (["1", "2", "3"].includes(e.key)) this.select(UTILITIES[Number(e.key) - 1]);
      else if (e.key === "0" || e.key === "Escape") { this.select(null); this.focus = null; this.queue = []; this.overview(); }
    }

    stepEvent(direction) {
      const times = [...new Set(UTILITIES.flatMap((u) => this.current[u].events.map((e) => e.time_s)))].sort((a, b) => a - b);
      const next = direction > 0 ? times.find((x) => x > this.t + 0.01) : [...times].reverse().find((x) => x < this.t - 0.01);
      if (next !== undefined) { this.pause(); this.overlay.replaceChildren(); this.seek(next); }
    }

    crossed(from, to) {
      const hits = [];
      for (const u of UTILITIES) {
        const run = this.current[u];
        for (const frame of run.frames) {
          if (frame.t > from && frame.t <= to && (frame.event || frame.note)) {
            const event = frame.event ? run.events.find((e) => e.id === frame.event) : null;
            hits.push({ utility: u, event, frame });
          }
        }
      }
      return hits;
    }

    beacon(utility, layer) {
      const n = NODES[utility];
      const ring = svg("circle", { cx: n.x, cy: n.y, r: 30, class: `th-beacon th-beacon-${layer || "dependency"}` });
      this.scene.beacons.append(ring);
      setTimeout(() => ring.remove(), 1800);
    }

    pushCaption(utility, text, layer, eventId, t) {
      if (!text) return;
      const item = html("div", { class: `th-caption th-caption-${layer || "dependency"}` }, [
        html("span", { class: "th-caption-site", text: NODES[utility].site }),
        html("span", { class: "th-caption-time", text: `${clock(t)}${eventId ? ` · ${eventId}` : ""}` }),
        html("span", { class: "th-caption-text", text }),
      ]);
      this.captionBox.prepend(item);
      while (this.captionBox.children.length > 3) this.captionBox.lastChild.remove();
    }

    loop(now) {
      const dt = this.lastNow ? Math.min(0.1, (now - this.lastNow) / 1000) : 0;
      this.lastNow = now;
      if (this.playing) {
        const slow = this.focus && now < this.focusUntil ? 0.18 : 1;
        this.rate = this.speed * slow;
        this.t = Math.min(this.duration, this.t + dt * this.rate);
        this.render(false, now);
        if (this.t >= this.duration) { this.pause(); this.overview(); this.showEnding(); }
      }
      if (this.focus && now >= this.focusUntil) {
        this.focus = null;
        if (!this.queue.length && !this.selected) this.overview();
      }
      if (!this.focus && this.queue.length && this.director) {
        const next = this.queue.shift();
        this.focus = next; this.focusUntil = now + 2300;
        this.focusOn(next, 1.7);
      }
      const k = 1 - Math.exp(-dt * 3.2);
      for (const key of ["x", "y", "w", "h"]) this.camera[key] += (this.target[key] - this.camera[key]) * k;
      this.scene.root.setAttribute("viewBox", `${this.camera.x.toFixed(1)} ${this.camera.y.toFixed(1)} ${this.camera.w.toFixed(1)} ${this.camera.h.toFixed(1)}`);
      requestAnimationFrame(this.loop);
    }

    render(force) {
      const from = this.lastT; const to = this.t;
      if (!force && to === from) return;
      if (to > from && !force) {
        for (const hit of this.crossed(from, to)) {
          const layer = hit.event ? hit.event.layer : "dependency";
          this.beacon(hit.utility, layer);
          this.pushCaption(hit.utility, caption(hit.utility, hit.event, hit.frame), layer, hit.event && hit.event.id, hit.frame.t);
          if (this.director && (!hit.event || SIGNIFICANT.has(hit.event.kind)) && !this.queue.includes(hit.utility) && this.focus !== hit.utility) {
            this.queue.push(hit.utility);
          }
        }
      }
      this.lastT = to;
      this.clockLabel.textContent = clock(to);
      this.playhead.style.left = `calc(64px + (100% - 64px) * ${to / this.duration})`;
      const frames = {};
      for (const u of UTILITIES) frames[u] = frameAt(this.current[u], to);
      this.paint(frames, to);
      if (this.display && this.selected) this.display.render(to);
      if (this.floor && this.selected) this.floor.render(to);
    }

    paint(frames, t) {
      const r = this.scene.refs;
      // Hydro: lights and turbine only from observed generation.
      const h = frames.hydro.cues;
      const generating = known(h.h1_generation_mw) && Number(h.h1_generation_mw.v) > 0;
      r.hydro.windows.classList.toggle("th-lit", generating);
      r.hydro.turbine.classList.toggle("th-spinning", generating);
      r.hydro.tailrace.classList.toggle("th-flowing", generating);
      r.sparks.classList.toggle("th-on", generating);
      // Treatment: commanded phase, labeled as a command.
      const p = frames.treatment.cues;
      const phase = known(p.p3_phase) ? p.p3_phase.v : null;
      r.treatment.bubbles.classList.toggle("th-on", phase === "BACKWASH");
      r.treatment.cmdTag.classList.toggle("th-on", phase === "BACKWASH");
      r.treatment.basins.forEach((b) => b.classList.toggle("th-still", phase !== "FILTERING"));
      const level = p.p3_bw_tank_level;
      r.treatment.bwUnknown.classList.toggle("th-hidden", known(level));
      const lh = known(level) ? Math.max(0, Math.min(1, Number(level.v) / 400)) * 30 : 0;
      r.treatment.bwFill.setAttribute("y", String(660 - lh)); r.treatment.bwFill.setAttribute("height", String(lh));
      // Distribution: run feedback, storage, notice.
      const d = frames.distribution.cues;
      const running = known(d.wd_p1_running) && d.wd_p1_running.v === true;
      r.distribution.rotor.classList.toggle("th-spinning", running);
      const storage = d.wd_storage_pct;
      r.distribution.unknown.classList.toggle("th-hidden", known(storage));
      const sh = known(storage) ? Math.max(0, Math.min(1, Number(storage.v) / 100)) * 60 : 0;
      r.distribution.fill.setAttribute("y", String(518 - sh)); r.distribution.fill.setAttribute("height", String(sh));
      r.distribution.level.textContent = known(storage) ? `${storage.v}%` : "?";
      const notice = d.wd_power_notice_kw;
      r.distribution.notice.classList.toggle("th-hidden", !known(notice));
      r.distribution.notice.classList.toggle("th-expired", notice.q === "expired");
      if (known(notice)) {
        const until = d.wd_notice_valid_until;
        r.distribution.noticeText.textContent = notice.q === "expired" ? `${notice.v} kW EXPIRED`
          : `${notice.v} kW · ${known(until) ? Math.max(0, Math.round(Number(until.v) - t)) : "?"} s`;
      }
      // Village lights follow only the distribution service record.
      const service = d.wd_service;
      r.village.lights.classList.toggle("th-on", known(service) && service.v === true);
      // Cards and halos.
      for (const u of UTILITIES) {
        const frame = frames[u];
        const lines = status(u, frame);
        this.cards[u].lines.forEach((line, i) => { line.textContent = lines[i]; line.classList.toggle("th-nodata", /NO DATA|NOT IN RECORD|PENDING/.test(lines[i])); });
        this.cards[u].event.textContent = frame.event ? frame.event : "";
        const top = frame.alarms[0];
        const state = top ? `th-alarm-${top.priority}` : frame.chain.service && frame.chain.service.current ? "th-ok" : "th-idle";
        this.cards[u].g.className = `th-card ${state}${this.selected === u ? " th-selected" : ""}`;
        const halo = this.scene.halos.querySelector(`[data-utility="${u}"]`);
        halo.setAttribute("class", `th-halo ${state}`);
      }
    }
  }

  /* Data-free context banner for the student workspace: the team's own utility is
   * highlighted; the others are dependency context outside the team's authority. */
  function mountContext(container, utility) {
    container.classList.add("th-context");
    const scene = buildScene(container);
    scene.root.setAttribute("aria-label", "Fictional region: your utility is highlighted; others are dependency context only");
    for (const u of UTILITIES) {
      const halo = scene.halos.querySelector(`[data-utility="${u}"]`);
      halo.setAttribute("class", `th-halo ${u === utility ? "th-own" : "th-other"}`);
      const label = scene.labels.querySelector(`[data-node="${u}"]`);
      label.setAttribute("class", `th-node-label ${u === utility ? "th-own-label" : "th-other-label"}`);
      if (u !== utility) {
        const n = NODES[u];
        scene.labels.append(svg("text", { x: n.x, y: n.y - (u === "distribution" ? 114 : 44), "text-anchor": "middle",
          class: "th-authority" }, ["outside your authority · context only"]));
      } else {
        const n = NODES[u];
        scene.labels.append(svg("text", { x: n.x, y: n.y - (u === "distribution" ? 114 : 44), "text-anchor": "middle",
          class: "th-authority th-own-authority" }, ["YOUR UTILITY"]));
      }
    }
    // A wide strip framed so the node, its label, and the authority note all stay in view.
    const n = NODES[utility];
    const w = 1240; const h = 210;
    scene.root.setAttribute("viewBox", `${Math.max(0, Math.min(W - w, n.x - w / 2))} ${Math.max(0, Math.min(H - h, n.y - 160))} ${w} ${h}`);

    return scene;
  }
